version: '3.8'

services:
  autovoiceover-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autovoiceover-system
    restart: unless-stopped
    ports:
      - "5256:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - autovoiceover_data:/app/data
      - ./src/AutoVoiceOver.Api/wwwroot/uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/DuKhach/bando"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  autovoiceover_data:

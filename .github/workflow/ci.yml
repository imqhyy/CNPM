name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore AutoVoiceOver.sln

    - name: Build Solution
      run: dotnet build AutoVoiceOver.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/AutoVoiceOver.Tests/AutoVoiceOver.Tests.csproj --no-build --configuration Release --verbosity normal